name: Pull edge functions from Supabase

# Downloads the live edge-function source into supabase/functions/ and opens a
# pull request with any changes. Download only: this workflow never deploys.
# Requires the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account →
# Access Tokens). The token never appears in the repo or in logs.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pull-edge-functions
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the secret is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Download functions (secret literals stripped, scan enforced)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: ./scripts/pull-edge-functions.sh

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add supabase/functions
          if git diff --cached --quiet; then
            echo "No changes: repo already matches the live functions."
            exit 0
          fi
          BRANCH="automation/edge-functions-${GITHUB_RUN_NUMBER}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Sync edge function source from Supabase (run ${GITHUB_RUN_NUMBER})"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Sync edge function source from Supabase" \
            --body "Automated download of the live edge functions (no deploy). save-prospect's shared secret is read from EXTENSION_SHARED_SECRET instead of being hard-coded. The secret scan passed." \
          || echo "::warning::Branch $BRANCH pushed, but the PR could not be opened automatically (repo setting: allow Actions to create pull requests). Open it from the branch."
