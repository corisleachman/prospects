function chipField(key,ph,list){const p=PROFILES[S.prof];return `<div class="chips">${p[key].map((t,i)=>`<button class="chip on x" aria-label="Remove ${h(t)}" onclick="PROFILES[${S.prof}].${key}.splice(${i},1);render()">${h(t)}</button>`).join('')}<input id="ci_${key}" class="chipin" type="text" placeholder="${ph}" ${list?`list="${list}"`:''} onkeydown="chipKey(event,'${key}',this)" onchange="${list?`chipAdd('${key}',this)`:''}"></div>`}
function chipKey(e,key,el){if(e.key==='Enter'||e.key===','){e.preventDefault();chipAdd(key,el)}}
function chipAdd(key,el){const vals=el.value.split(/[,\n]+/).map(v=>v.trim()).filter(Boolean);if(!vals.length)return;const a=PROFILES[S.prof][key];vals.forEach(v=>{if(!a.includes(v))a.push(v)});render();const n=document.getElementById('ci_'+key);if(n)n.focus()}

function kwSpans(a){return a.map(p=>p.startsWith('-')?`<span class="not">${h(p.slice(1))}</span>`:/^".*"$/.test(p)?`<span class="ex">${h(p)}</span>`:`<span>${h(p)}</span>`).join('')}

  return `<h2>Voice and copy</h2><div class="grid2">
  <div class="field"><span class="lbl">Write openers for</span><div class="chips"><span class="chip on">Email</span><span class="chip on">LinkedIn</span></div></div>
  <div class="field"><label for="so">Sign-off</label><input id="so" type="text" value="Best,"></div></div>
  <div class="field"><label for="ex">Real example messages (paste 3 to 10)</label><span class="hint">These teach tone, length and phrasing. Nothing is copied or picked from this list: every opener is written fresh from its signal, in this style.</span><textarea id="ex" style="min-height:110px">Hi Jamie, saw the new spring campaign go live. Really sharp work. Would be good to connect.
Hi Taylor, congrats on the move to the CMO role. Big brief ahead. Happy to connect.</textarea></div>
  <div class="grid2"><div class="field"><label for="ban">Never say</label><input id="ban" type="text" value="synergy, circle back, I hope this finds you well, game-changer"></div>
  <div class="field"><label for="len">LinkedIn length</label><select id="len"><option>Up to 280 characters</option><option>Up to 200 characters</option></select></div></div>`;
}
function s6(){
  return `<h2>Who gets what</h2><div class="hint" style="margin-top:-8px">Each person sees only the cards from the profiles switched on in their row, in the app and in their morning email.</div><div class="tblwrap"><table style="min-width:560px"><thead><tr><th>Person</th><th>Role</th><th>Profiles they receive</th><th>Morning email</th><th></th></tr></thead><tbody>
  ${USERS.map((u,ui)=>`<tr><td><b>${h(u.n)}</b>${u.e?`<div class="muted" style="font-size:12px">${h(u.e)}${u.pending?' · invite sent':''}</div>`:''}</td><td><select aria-label="Role" style="width:auto" onchange="USERS[${ui}].r=this.value">${['Client admin','Salesperson'].map(r=>`<option ${r===u.r?'selected':''}>${r}</option>`).join('')}</select></td><td><div class="chips">${PROFILES.map(p=>`<button class="chip ${u.p.includes(p.code)?'on':''}" onclick="togUP(${ui},'${p.code}')">${p.code}</button>`).join('')}</div></td><td><select aria-label="Morning email time" style="width:auto" onchange="USERS[${ui}].t=this.value">${['Off','07:00','07:30','08:00','08:30'].map(t=>`<option ${t===u.t?'selected':''}>${t}</option>`).join('')}</select></td><td><button class="linkbtn del" onclick="USERS.splice(${ui},1);render()">Remove</button></td></tr>`).join('')}
  ${S.inviting?`<tr><td><input id="nu_n" type="text" placeholder="Name"><input id="nu_e" type="email" placeholder="Email" style="margin-top:6px"></td><td><select id="nu_r" style="width:auto"><option>Salesperson</option><option>Client admin</option></select></td><td colspan="2" class="hint">Pick profiles after adding.</td><td><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm pri" onclick="addUser()">Add and invite</button><button class="linkbtn" onclick="S.inviting=false;render()">Cancel</button></div></td></tr>`:''}
  </tbody></table></div>
  <div class="grid3"><div class="field"><label for="cap">Max cards per person per day</label><select id="cap"><option>10</option><option>5</option><option>20</option></select></div>
  <div class="field"><label for="cool">Don’t repeat a person for</label><select id="cool"><option>30 days</option><option>14 days</option><option>60 days</option></select></div>
  <div class="field"><label for="day">Send on</label><select id="day"><option>Weekdays</option><option>Every day</option></select></div></div>
  ${S.inviting?'':`<button class="btn sm" style="align-self:flex-start" onclick="S.inviting=true;render();document.getElementById('nu_n').focus()">+ Add person</button>`}`;
}
function addUser(){const n=document.getElementById('nu_n').value.trim(),e=document.getElementById('nu_e').value.trim(),r=document.getElementById('nu_r').value;if(!n||!e){toast('Add a name and email');return}USERS.push({n,e,r,p:[],t:'07:30',pending:true});S.inviting=false;render();toast('Invite would be emailed to '+e)}
function togUP(ui,c){const a=USERS[ui].p;const i=a.indexOf(c);i>=0?a.splice(i,1):a.push(c);render()}
function s7(){
  const ran=S.testRan;
  return `<h2>Test and go live</h2><p class="muted" style="margin:0">Runs once over the last 48 hours with the current setup. Nothing is sent to the client until you go live.</p>
  ${ran==='busy'?`<div class="preview"><span><span class="spin"></span> Collecting from 5 sources across 5 profiles…</span></div>`:ran?`<div class="grid4"><div class="panel stat"><div class="k">Items collected</div><div class="v">1,482</div></div><div class="panel stat"><div class="k">Fresh, not duplicate</div><div class="v">317</div></div><div class="panel stat"><div class="k">Usable cards</div><div class="v">6</div><div class="d">score 7 or more</div></div><div class="panel stat"><div class="k">Test cost</div><div class="v">$6.40</div></div></div>
  <div class="tblwrap"><table style="min-width:520px"><thead><tr><th>Dropped because</th><th>Items</th></tr></thead><tbody><tr><td>Older than the window or no date</td><td class="num">1,041</td></tr><tr><td>Duplicate of another report</td><td class="num">124</td></tr><tr><td>Didn’t match a profile</td><td class="num">266</td></tr><tr><td>Matched but scored below 7</td><td class="num">45</td></tr></tbody></table></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="setRole('client')">Review the 6 sample cards</button>${S.clientStatus==='Live'?`<span class="pill live" style="align-self:center">Live · first list tomorrow 07:30</span>`:`<button class="btn pri" onclick="S.clientStatus='Live';render();toast('Before: Work is live')">Go live</button>`}</div>`
  :`<button class="btn navy" style="align-self:flex-start" onclick="runTest()">Run test</button>`}
  <p class="note" style="margin:0">Figures are illustrative. The sourcing test will give real ones.</p>`;
}
function runTest(){S.testRan='busy';render();setTimeout(()=>{S.testRan=true;if(S.view==='setup')render()},1400)}

function vRuns(){
  return `<div class="head"><div><h1>Runs and costs</h1><div class="sub">This morning’s collection, all clients</div></div></div>
  <div class="panel tblwrap"><table><thead><tr><th>Client</th><th>Source</th><th>Items</th><th>Fresh</th><th>Usable</th><th>Cost</th><th>Per usable card</th><th>Status</th></tr></thead><tbody>
  ${[['Coris','LinkedIn posts',220,61,6,'$2.10','$0.35','ok'],['Coris','News search',540,88,5,'$1.40','$0.28','ok'],['Coris','Trade press',310,44,3,'$0.00','$0.00','ok'],['Example client','Job changes',0,0,0,'$0.00','n/a','fail'],['Example client','News search',260,31,3,'$0.90','$0.30','ok']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td><td>${r[7]==='ok'?'<span class="pill live">Done</span>':'<span class="pill warn">Failed · retry</span>'}</td></tr>`).join('')}
  </tbody></table></div><p class="note">Example figures.</p>`;
}
function vBudget(){
  return `<div class="head"><div><h1>Budgets</h1><div class="sub">Scraping and AI spend per client · renews on a set date</div></div></div>
  <div class="panel tblwrap"><table><thead><tr><th>Client</th><th>Period</th><th>Budget</th><th>Used</th><th></th><th>Left</th><th>Renews</th><th>Per usable card</th><th></th></tr></thead><tbody>
  ${[['Before: Work','Monthly',300,0,'1 Nov','n/a'],['Coris','Monthly',170,78,'1 Nov','$0.31'],['Example client','Monthly',130,121,'1 Nov','$0.42']].map(r=>{const pct=Math.round(r[3]/r[2]*100);return `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="num">$${r[2]}</td><td class="num">$${r[3]}</td><td><div class="meter" style="width:120px"><b class="${pct>85?'hot':''}" style="width:${pct}%"></b></div></td><td class="num">$${r[2]-r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td><button class="btn sm" onclick="toast('Top-up or renewal would be recorded')">Renew or top up</button></td></tr>`}).join('')}
  </tbody></table></div>
  <p class="note">When a budget runs out, collection pauses and the client’s list says "Paused until your budget renews". Example figures.</p>`;
}

/* client side */
function visibleCards(){return CARDS.filter(c=>!STATE.hidden[c.id]&&!STATE.sent[c.id]&&(S.pfilter==='all'||c.p===S.pfilter)&&(S.filter==='all'||(S.filter==='pos'&&c.pol!=='neg')||(S.filter==='neg'&&c.pol==='neg')))}
function vToday(){
  const list=visibleCards();
  return `<div class="banner">You’re viewing what a Before: Work salesperson sees. Example companies and people, all fictional.</div>
  <div class="head"><div><h1>Today</h1><div class="sub">Thursday 15 October · ${list.length} ${list.length===1?'person':'people'} worth reaching out to</div></div></div>
  <div class="today"><div class="filters">
    <div class="field"><span class="lbl">Profile</span><div class="chips"><button class="chip ${S.pfilter==='all'?'on':''}" onclick="S.pfilter='all';render()">All</button>${PROFILES.map(p=>`<button class="chip ${S.pfilter===p.code?'on':''}" onclick="S.pfilter='${p.code}';render()">${p.code}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Type</span><div class="chips">${[['all','All'],['pos','Positive'],['neg','Sensitive']].map(f=>`<button class="chip ${S.filter===f[0]?'on':''}" onclick="S.filter='${f[0]}';render()">${f[1]}</button>`).join('')}</div></div>
    <div class="panel stat"><div class="k">This week</div><div class="v">${Object.keys(STATE.sent).length}</div><div class="d">marked sent</div></div>
  </div>
  <div class="cards">${list.length?list.map(card).join(''):`<div class="panel" style="padding:24px;text-align:center"><b>You’re all caught up.</b><div class="muted" style="margin-top:4px">Next list tomorrow at 07:30. The system never pads the list with weak or old signals.</div></div>`}</div></div>`;
}
function card(c){
  const tab=S.ctab[c.id]||'li'; const r=S.rewrites[c.id]||0; const txt=(tab==='li'?c.li:c.em)[r%2];
  const prof=PROFILES.find(p=>p.code===c.p);
  return `<article class="scard" id="card${c.id}">
    <div class="who"><div class="av">${c.ini}</div><div style="min-width:0"><b>${h(c.name)}</b> · ${h(c.title)}<div class="muted" style="font-size:12.5px">${h(c.co)} · ${h(c.meta)}</div></div>
    <div class="tags"><span class="pill prof" title="${h(prof.name)}">${c.p}</span><span class="pill ${c.pol}">${c.pol==='neg'?'Sensitive':h(c.tag)}</span></div></div>
    <div class="what">${h(c.what)}</div>
    <div class="src"><span>${h(c.src)} · ${h(c.age)}</span><a href="#card${c.id}" onclick="toast('Would open the source article');return false">Open source</a>${c.also?`<span>${h(c.also)}</span>`:''}</div>
    <div class="why"><b>Why this person:</b> ${h(c.why)}</div>
    <div class="ctabs"><button class="${tab==='li'?'on':''}" onclick="S.ctab[${c.id}]='li';render()">LinkedIn</button><button class="${tab==='em'?'on':''}" onclick="S.ctab[${c.id}]='em';render()">Email</button><span class="hint" style="margin-left:auto;align-self:center">${tab==='li'?txt.length+' characters':''}</span></div>
    <div class="copy" id="copy${c.id}">${h(txt)}</div>
    ${S.notRel===c.id?`<div class="reasons"><span class="lbl">Why isn’t it relevant?</span>${['Wrong person','Wrong company','Old news','Weak reason','Already in touch'].map(x=>`<button class="chip" onclick="dismiss(${c.id},'${x}')">${x}</button>`).join('')}<button class="btn sm" onclick="S.notRel=null;render()">Cancel</button></div>`:`
    <div class="acts"><button class="btn sm pri" onclick="copyTxt(${c.id})">Copy</button><button class="btn sm" onclick="toast('Would open ${h(c.name)} on LinkedIn')">Open LinkedIn</button><button class="btn sm" onclick="S.rewrites[${c.id}]=(S.rewrites[${c.id}]||0)+1;render()">Rewrite</button><button class="btn sm" onclick="markSent(${c.id})">Mark sent</button><button class="btn sm" onclick="S.notRel=${c.id};render()">Not relevant</button></div>`}
  </article>`;
}
function copyTxt(id){const t=document.getElementById('copy'+id).textContent;const ok=()=>toast('Copied');try{navigator.clipboard.writeText(t).then(ok,()=>sel(id))}catch(e){sel(id)}}
function sel(id){const r=document.createRange();r.selectNodeContents(document.getElementById('copy'+id));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected, press Ctrl or Cmd + C')}
function markSent(id){STATE.sent[id]=new Date();render();toast('Marked sent. They won’t reappear for 30 days.')}
function dismiss(id,why){STATE.hidden[id]=true;STATE.reason[id]=why;S.notRel=null;render();toast('Thanks. "'+why+'" helps tune the rules.')}
function vSaved(){
  const sent=CARDS.filter(c=>STATE.sent[c.id]), dis=CARDS.filter(c=>STATE.hidden[c.id]);
  return `<div class="head"><div><h1>Sent and history</h1><div class="sub">What you’ve acted on</div></div></div>
  <div class="panel tblwrap"><table style="min-width:560px"><thead><tr><th>Person</th><th>Signal</th><th>Outcome</th><th></th></tr></thead><tbody>
  ${sent.length+dis.length?[...sent.map(c=>`<tr><td><b>${h(c.name)}</b><div class="muted" style="font-size:12px">${h(c.co)}</div></td><td>${h(c.tag)}</td><td><span class="pill live">Sent</span></td><td><button class="btn sm" onclick="toast('Marked replied')">Mark replied</button></td></tr>`),...dis.map(c=>`<tr><td><b>${h(c.name)}</b><div class="muted" style="font-size:12px">${h(c.co)}</div></td><td>${h(c.tag)}</td><td><span class="pill setup">Not relevant · ${h(STATE.reason[c.id])}</span></td><td><button class="btn sm" onclick="delete STATE.hidden[${c.id}];render()">Restore</button></td></tr>`)].join(''):`<tr><td colspan="4" class="muted" style="padding:20px">Nothing yet. Mark a card sent or not relevant on Today and it will show here.</td></tr>`}
  </tbody></table></div>`;
}
function vEmail(){
  const list=CARDS.filter(c=>['01A','01B'].includes(c.p));
  return `<div class="head"><div><h1>Morning email</h1><div class="sub">What Jordan (01A and 01B) receives at 07:30</div></div></div>
  <div class="email"><div class="eh"><span><b>From:</b> Signals for Before: Work</span><span><b>Subject:</b> ${list.length} reasons to reach out today</span></div>
  <div class="eb"><p style="margin:0">Morning Jordan, ${list.length} people in your profiles did something worth noticing since yesterday.</p>
  ${list.map(c=>`<div class="erow"><span><b>${h(c.name)}</b>, ${h(c.co)}<br><span class="muted" style="font-size:12.5px">${h(c.what)}</span></span><span class="pill ${c.pol}" style="align-self:flex-start;white-space:nowrap">${c.pol==='neg'?'Sensitive':h(c.tag)}</span></div>`).join('')}
  <button class="btn pri" style="align-self:flex-start" onclick="go('today')">Open today’s list</button></div></div>`;
}

function render(){
  nav();
  const v={clients:vClients,client:vClient,setup:vSetup,runs:vRuns,budget:vBudget,today:vToday,saved:vSaved,email:vEmail}[S.view]||vClients;
  document.getElementById('main').innerHTML=v();
}
render();
</script>

</body></html>
